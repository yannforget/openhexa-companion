# fly.toml app configuration file generated for openhexa-companion on 2026-11-24T17:12:01+01:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'openhexa-companion'
primary_region = 'ams'

[build]
[env]
  COMPANION_DATABASE = '/data/companion.db'

[[mounts]]
  source = 'data'
  destination = '/data'
  initial_size = '1gb'
  snapshot_retention = 14

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/.well-known/oauth-authorization-server'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
