<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title · OpenHEXA Companion</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; color: #1f2937; line-height: 1.5; }
h1 { font-size: 1.5rem; }
.error { background: #fef2f2; border: 1px solid #fca5a5; padding: 0.75rem 1rem; border-radius: 0.375rem; }
.row { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
.row input { flex: 1; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 0.375rem; font: inherit; }
.row input[name=token] { flex: 2; }
.actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
button { padding: 0.5rem 1rem; border-radius: 0.375rem; border: 1px solid #d1d5db; background: white; font: inherit; cursor: pointer; }
button.primary { background: #1d4ed8; border-color: #1d4ed8; color: white; }
code { background: #f3f4f6; padding: 0 0.25rem; border-radius: 0.25rem; }
small { color: #6b7280; }
</style>
</head>
<body>
<h1>$title</h1>
$body
</body>
</html>
