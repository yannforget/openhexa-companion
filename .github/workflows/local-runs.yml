# Runs `hexa run` end to end with Docker and Podman, against the demo workspace.
name: Local runs

on:
  workflow_dispatch:
    inputs:
      image:
        description: Pipeline image to test
        default: blsq/openhexa-blsq-environment:latest

jobs:
  container:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    env:
      HEXA_CONTAINER_ENGINE: ${{ matrix.engine }}
      HEXA_TEST_IMAGE: ${{ inputs.image }}
    steps:
      # Before setup-uv, which installs into /opt/hostedtoolcache.
      - name: Free disk space for the image
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Pull the image
        run: ${{ matrix.engine }} pull --platform linux/amd64 "docker.io/$HEXA_TEST_IMAGE"
      - name: Write the demo workspace credentials
        run: |
          {
            echo "OPENHEXA_URL=${{ secrets.OPENHEXA_URL }}"
            echo "OPENHEXA_WORKSPACE=${{ secrets.OPENHEXA_WORKSPACE }}"
            echo "OPENHEXA_TOKEN=${{ secrets.OPENHEXA_TOKEN }}"
          } > .env
      - name: Run the container tests
        run: uv run pytest -m container -v
